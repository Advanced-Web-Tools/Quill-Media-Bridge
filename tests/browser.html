<!doctype html>
<meta charset="utf-8">
<title>Quill Media Bridge adapter checks</title>
<body>Running…</body>
<script type="module">
try {
    const check = (condition, message) => { if (!condition) throw new Error(message); };
    const requests = [];
    window.fetch = async (url, options) => {
        requests.push({ url, options });
        const album = url.searchParams.get('album_id');
        const second = url.searchParams.get('offset') === '24';
        return { ok: true, json: async () => ({ status: 200, message: 'OK', data: {
            items: [{ name: album ? 'Album image' : 'All images', kind: 'image', source: second ? '/second.png' : '/first.png' }],
            has_more: !second, next_offset: second ? null : 24,
        } }) };
    };
    const { default: mount } = await import('../QuillMediaBridge/assets/media-library.js');
    const { default: mountAlbum } = await import('../QuillMediaBridge/assets/media-library.js?album_id=7');
    const container = document.createElement('div');
    const controller = new AbortController();
    const selections = [];
    const instance = await mount({ container, type: 'image', value: '/first.png', onSelect: item => selections.push(item), signal: controller.signal });
    check(!requests[0].url.searchParams.has('album_id'), 'Universal feed must have no album filter.');
    check(requests[0].url.searchParams.get('kind') === 'image', 'Feed must filter the selected media type.');
    check(requests[0].options.signal === controller.signal, 'Fetch must respect Quill cancellation.');
    const button = container.querySelector('button');
    check(button.getAttribute('aria-pressed') === 'true', 'Current source must appear selected.');
    button.click();
    check(selections[0].url === '/first.png' && selections[0].alt === 'All images', 'Selection must use the Quill callback.');
    instance.update({ value: '/different.png' });
    check(button.getAttribute('aria-pressed') === 'false', 'Selection changes must refresh the active item.');
    container.lastElementChild.click();
    await new Promise(resolve => setTimeout(resolve, 0));
    check(requests[1].url.searchParams.get('offset') === '24', 'Load more must use the next offset.');
    check(container.lastElementChild.hidden, 'Last page must hide load more.');
    await mountAlbum({ container: document.createElement('div'), type: 'image', value: '', onSelect() {}, signal: controller.signal });
    check(requests[2].url.searchParams.get('album_id') === '7', 'Album module must filter its own album.');
    const search = container.querySelector('input[type="search"]');
    check(container.firstElementChild === search, 'Search must be above the gallery.');
    check(container.children[1].style.columnCount === '2', 'Gallery must use two columns.');
    check(container.querySelector('img').style.height === 'auto', 'Images must retain their aspect ratio.');
    search.value = 'photo';
    search.dispatchEvent(new Event('input'));
    search.value = 'wallhaven';
    search.dispatchEvent(new Event('input'));
    await new Promise(resolve => setTimeout(resolve, 300));
    check(requests.length === 4, 'Typing must debounce the search request.');
    check(requests[3].url.searchParams.get('q') === 'wallhaven', 'Search must reach the media feed.');
    check(requests[3].url.searchParams.get('offset') === '0', 'Search must reset pagination.');
    check(container.querySelectorAll('img').length === 1, 'Search must replace previous results.');
    controller.abort();
    button.click();
    check(selections.length === 1, 'Aborted pickers must not select media.');
    document.body.textContent = 'PASS: Quill Media Bridge adapter checks';
} catch (error) {
    document.body.textContent = 'FAIL: ' + error.stack;
}
</script>
